name: AgentSessionManager
options:
  bundleIdPrefix: com.justinfuller
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release
  Dev: release

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.13.0
  opentelemetry-swift:
    url: https://github.com/open-telemetry/opentelemetry-swift
    from: 1.9.0

targets:
  AgentSessionManager:
    type: application
    platform: macOS
    sources:
      - Sources/AgentSessionManager
      - path: AppIcons/Assets.xcassets
        type: folder
    info:
      path: Info.plist
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lsqlite3"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager.xcode-debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager.xcode-release
        Dev:
          PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager.xcode-dev
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEV_BUILD
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: opentelemetry-swift
        product: OpenTelemetryApi
      - package: opentelemetry-swift
        product: OpenTelemetrySdk
      - package: opentelemetry-swift
        product: StdoutExporter
      - package: opentelemetry-swift
        product: ResourceExtension
      - package: opentelemetry-swift
        product: SignPostIntegration
    entitlements:
      path: AgentSessionManager.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true

  AgentSessionManagerUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager.uitests
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager.uitests
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager.uitests
        Dev:
          PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager.dev.uitests
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEV_BUILD
    entitlements:
      path: AgentSessionManagerUITests.entitlements
      properties:
        com.apple.security.app-sandbox: false
    dependencies:
      - target: AgentSessionManager
        embed: false
