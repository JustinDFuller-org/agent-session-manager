name: AgentSessionManager
options:
  bundleIdPrefix: com.justinfuller
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release
  Dev: release

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.13.0

targets:
  AgentSessionManager:
    type: application
    platform: macOS
    sources:
      - Sources/AgentSessionManager
      - path: AppIcons/Assets.xcassets
        type: folder
    info:
      path: Info.plist
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager
        Dev:
          PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager.dev
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEV_BUILD
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
    entitlements:
      path: AgentSessionManager.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true

  AgentSessionManagerUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager.uitests
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager.uitests
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager.uitests
        Dev:
          PRODUCT_BUNDLE_IDENTIFIER: com.justinfuller.agent-session-manager.dev.uitests
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEV_BUILD
    entitlements:
      path: AgentSessionManagerUITests.entitlements
      properties:
        com.apple.security.app-sandbox: false
    dependencies:
      - target: AgentSessionManager
        embed: false
