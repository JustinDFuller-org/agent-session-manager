name: PR Quality

on:
  workflow_call:

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-description:
    name: PR Description Check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR description length
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ ${#PR_BODY} -lt 50 ]; then
            echo "PR description must be at least 50 characters long."
            exit 1
          fi
