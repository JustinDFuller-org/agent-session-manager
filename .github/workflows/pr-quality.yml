name: PR Quality

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-description:
    name: PR Description Check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description length
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ ${#PR_BODY} -lt 50 ]; then
            echo "PR description must be at least 50 characters long."
            exit 1
          fi

  wip-check:
    name: WIP Check
    runs-on: ubuntu-latest
    steps:
      - uses: wip/action@v1
        with:
          associated_pull_request_number: ${{ github.event.pull_request.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
