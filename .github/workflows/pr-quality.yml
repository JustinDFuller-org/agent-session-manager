name: PR Quality

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-description:
    name: PR Description Check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR description length
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ ${#PR_BODY} -lt 50 ]; then
            echo "PR description must be at least 50 characters long."
            exit 1
          fi

  wip-check:
    name: WIP Check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: wip/action@cef38e47be00eb456c890227cf65571274194379
        with:
          associated_pull_request_number: ${{ github.event.pull_request.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
