name: OpenSpec

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions: {}

jobs:
  openspec-check:
    name: openspec-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout base-branch enforcement source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          path: enforcement-source
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Test base-owned validator
        run: node --test enforcement-source/.github/scripts/openspec-merge-gate.test.mjs

      - name: Collect trusted effective pull request changes
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MANIFEST_PATH: ${{ runner.temp }}/openspec-changed-files.json
        with:
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            const pullRequest = context.payload.pull_request
            const stack = pullRequest.stack || null
            const headRepository = pullRequest.head?.repo?.full_name
            const repository = context.payload.repository.full_name
            const headSha = pullRequest.head?.sha

            if (!headSha || !headRepository) {
              core.setFailed('OpenSpec: pull request head repository and immutable SHA are required.')
              return
            }

            let files
            let source
            if (headRepository !== repository) {
              if (stack) {
                core.setFailed('OpenSpec: formal stacked pull requests must use the base repository head.')
                return
              }
              files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pullRequest.number,
                per_page: 100,
              })
              source = 'pull-request-files'
            } else {
              const baseSha = stack?.base?.sha || pullRequest.base?.sha
              if (!baseSha) {
                core.setFailed('OpenSpec: effective pull request base SHA is required.')
                return
              }

              const compareFiles = []
              for (let page = 1; page <= 3; page += 1) {
                const response = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${baseSha}...${headSha}`,
                  page,
                  per_page: 100,
                })
                const pageFiles = response.data.files || []
                compareFiles.push(...pageFiles)
                if (pageFiles.length < 100) break
                if (page === 3) {
                  core.setFailed('OpenSpec: effective pull request diff exceeds the supported file manifest size.')
                  return
                }
              }
              files = compareFiles
              source = stack ? 'stack-trunk-compare' : 'base-head-compare'
            }

            fs.writeFileSync(process.env.MANIFEST_PATH, JSON.stringify({
              source,
              files: files.map(file => ({
                filename: file.filename,
                status: file.status,
                previous_filename: file.previous_filename || null,
              })),
            }))

      - name: Checkout immutable pull request candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false

      - name: Copy base-owned validator
        run: cp enforcement-source/.github/scripts/openspec-merge-gate.mjs "$RUNNER_TEMP/openspec-merge-gate.mjs"

      - name: Validate OpenSpec state for pull request
        if: github.event_name == 'pull_request_target'
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          STACK_BASE_REF: ${{ github.event.pull_request.stack.base.ref || '' }}
          STACK_POSITION: ${{ github.event.pull_request.stack.position || '' }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/openspec-merge-gate.mjs" \
            --candidate "$GITHUB_WORKSPACE/candidate" \
            --require-new-change \
            --changed-files "$RUNNER_TEMP/openspec-changed-files.json"

      - name: Validate OpenSpec state on main
        if: github.event_name == 'push'
        run: node "$RUNNER_TEMP/openspec-merge-gate.mjs" --candidate "$GITHUB_WORKSPACE/candidate"

  openspec-label:
    name: openspec-label
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Apply openspec label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo
            const pull_number = context.payload.pull_request.number

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
            })

            const touchesOpenspec = files.some(f => f.filename.startsWith('openspec/'))
            if (!touchesOpenspec) return

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pull_number,
              labels: ['openspec'],
            })
