name: Swift Build Check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  resolve:
    name: swift package resolve
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check supported Swift toolchain
        run: bash scripts/check-toolchain.sh swift-only

      - name: Resolve packages
        run: swift package resolve
