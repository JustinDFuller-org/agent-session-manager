name: Unit Tests

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: swift test
    permissions:
      contents: read
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check supported toolchain floor
        run: bash scripts/check-toolchain.sh

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build/checkouts
          key: swift-packages-${{ hashFiles('Package.resolved') }}

      - name: Run unit tests
        run: swift test --triple "$(uname -m)-apple-macosx14.0" --enable-code-coverage
