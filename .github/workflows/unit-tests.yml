name: Unit Tests

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "UITests/**"
      - "Package.swift"
      - "Package.resolved"
      - "project.yml"
      - "*.xcodeproj/**"
      - "*.xcworkspace/**"
      - "Makefile"
      - "scripts/**"
      - ".swift-version"
      - ".xcode-version"
      - "*.xcconfig"
      - "*.plist"
      - "Sources/**/Resources/**"
      - "Assets.xcassets/**"
      - ".github/**"
      - ".agents/**"
      - "openspec/**"
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  macos-policy:
    name: resolve trusted macOS policy
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.policy.outputs.enabled }}
    steps:
      - id: policy
        env:
          ENABLE_MACOSX_JOBS: ${{ vars.ENABLE_MACOSX_JOBS }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" || "$ENABLE_MACOSX_JOBS" != "false" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
  test:
    name: swift test
    needs: macos-policy
    permissions:
      contents: read
    if: needs.macos-policy.outputs.enabled == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check supported toolchain floor
        run: bash scripts/check-toolchain.sh

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build/checkouts
          key: swift-packages-${{ hashFiles('Package.resolved') }}

      - name: Run unit tests
        run: swift test --triple "$(uname -m)-apple-macosx14.0" --enable-code-coverage
