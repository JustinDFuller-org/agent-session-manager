name: Format

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  swift-format:
    name: swift-format check
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check supported Swift toolchain
        run: bash scripts/check-toolchain.sh swift-only

      - name: Check formatting
        run: swift format lint --recursive --strict Sources/ Tests/ UITests/
