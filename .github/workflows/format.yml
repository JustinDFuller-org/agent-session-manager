name: Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-format:
    name: swift-format check
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Check formatting
        run: swift format lint --recursive --strict Sources/ Tests/ UITests/
