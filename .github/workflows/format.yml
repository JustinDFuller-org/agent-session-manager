name: Format

on:
  workflow_call:
  push:
    branches: [main]
concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  swift-format:
    name: swift-format check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check supported Swift toolchain
        run: bash scripts/check-toolchain.sh swift-only

      - name: Check formatting
        run: swift format lint --recursive --strict Sources/ Tests/ UITests/
