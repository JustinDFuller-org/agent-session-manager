name: Documentation

on:
  workflow_call:
  push:
    branches: [main]
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  docs-check:
    name: Jekyll build and link check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate documentation
        run: make docs-check

      - name: Validate release publication contract
        run: scripts/test-release-publishing.sh
