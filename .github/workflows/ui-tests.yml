name: UI Tests

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "UITests/**"
      - "Package.swift"
      - "Package.resolved"
      - "project.yml"
      - "*.xcodeproj/**"
      - "*.xcworkspace/**"
      - "Makefile"
      - "scripts/**"
      - ".swift-version"
      - ".xcode-version"
      - "*.xcconfig"
      - "*.plist"
      - "Sources/**/Resources/**"
      - "Assets.xcassets/**"
      - ".github/**"
      - ".agents/**"
      - "openspec/**"
  workflow_dispatch:

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  macos-policy:
    name: resolve trusted macOS policy
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.policy.outputs.enabled }}
    steps:
      - id: policy
        env:
          ENABLE_MACOSX_JOBS: ${{ vars.ENABLE_MACOSX_JOBS }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" || "$ENABLE_MACOSX_JOBS" != "false" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
  test:
    name: make test-ui-dev-launch
    needs: macos-policy
    permissions:
      contents: read
    if: needs.macos-policy.outputs.enabled == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check supported toolchain floor
        run: bash scripts/check-toolchain.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run launch-behavior UI tests
        run: make test-ui-dev-launch

      - name: Upload xcresult
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-test-results
          path: .build/TestResults.xcresult
