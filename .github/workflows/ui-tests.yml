name: UI Tests

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: make test-ui-dev-launch
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check supported toolchain floor
        run: bash scripts/check-toolchain.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run launch-behavior UI tests
        run: make test-ui-dev-launch

      - name: Upload xcresult
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-test-results
          path: .build/TestResults.xcresult
