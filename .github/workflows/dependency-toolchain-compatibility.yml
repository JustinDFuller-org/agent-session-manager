name: Dependency and Toolchain Compatibility

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "Package.swift"
      - "Package.resolved"
      - "project.yml"
      - "Sources/**"
      - "Tests/**"
      - "UITests/**"
      - "Makefile"
      - "scripts/**"
      - ".swift-version"
      - ".xcode-version"
      - "*.xcconfig"
      - "*.plist"
      - "Sources/**/Resources/**"
      - "Assets.xcassets/**"
      - ".github/**"
      - ".agents/**"
      - "openspec/**"
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Dependency and toolchain compatibility
    if: ${{ github.event_name != 'pull_request' || vars.ENABLE_MACOSX_JOBS != 'false' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check supported toolchain floor
        run: bash scripts/check-toolchain.sh

      - name: Resolve locked packages
        run: swift package resolve

      - name: Build release package
        run: swift build -c release
