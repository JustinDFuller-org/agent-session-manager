name: Dependency and Toolchain Compatibility

on:
  workflow_call:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-toolchain-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  compatibility:
    name: Dependency and toolchain compatibility
    permissions:
      contents: read
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check supported toolchain floor
        run: bash scripts/check-toolchain.sh

      - name: Resolve locked packages
        run: swift package resolve

      - name: Build release package
        run: swift build -c release
