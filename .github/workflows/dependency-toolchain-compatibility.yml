name: Dependency and Toolchain Compatibility

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "Package.swift"
      - "Package.resolved"
      - "project.yml"
      - "*.xcodeproj/**"
      - "*.xcworkspace/**"
      - "Sources/**"
      - "Tests/**"
      - "UITests/**"
      - "Makefile"
      - "scripts/**"
      - ".swift-version"
      - ".xcode-version"
      - "*.xcconfig"
      - "*.plist"
      - "Sources/**/Resources/**"
      - "Assets.xcassets/**"
      - ".github/**"
      - ".agents/**"
      - "openspec/**"
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-toolchain-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  macos-policy:
    name: resolve trusted macOS policy
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.policy.outputs.enabled }}
    steps:
      - id: policy
        env:
          ENABLE_MACOSX_JOBS: ${{ vars.ENABLE_MACOSX_JOBS }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" || "$ENABLE_MACOSX_JOBS" != "false" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
  compatibility:
    name: Dependency and toolchain compatibility
    needs: macos-policy
    permissions:
      contents: read
    if: needs.macos-policy.outputs.enabled == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check supported toolchain floor
        run: bash scripts/check-toolchain.sh

      - name: Resolve locked packages
        run: swift package resolve

      - name: Build release package
        run: swift build -c release
