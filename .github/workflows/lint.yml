name: Lint

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install SwiftLint
        run: |
          curl -Lo swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.58.2/swiftlint_linux.zip
          unzip -j swiftlint.zip swiftlint -d /usr/local/bin

      - name: Run SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml
