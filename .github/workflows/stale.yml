name: Stale

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  stale:
    name: Mark stale issues and PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10.3.0
        with:
          stale-pr-label: "stale"
          stale-issue-label: "stale"
          days-before-pr-stale: 7
          days-before-issue-stale: 90
          days-before-pr-close: 7
          days-before-issue-close: 14
          stale-pr-message: >
            This PR has been open with no activity for 7 days.
            It will be closed in 7 days if there is no further activity.
          stale-issue-message: >
            This issue has been open with no activity for 90 days.
            It will be closed in 14 days if there is no further activity.
          close-pr-message: >
            Closing this PR due to inactivity. Feel free to reopen if you would like to continue.
          close-issue-message: >
            Closing this issue due to inactivity. Feel free to reopen if needed.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
